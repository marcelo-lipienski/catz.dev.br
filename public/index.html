<!-- Micro-interaction for Search Focus & SPA Router -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const searchContainer = document.querySelector('.bg-surface-container-low');
    if (searchContainer) {
      searchContainer.addEventListener('mouseenter', () => {
        searchContainer.classList.add('border-primary/50');
      });
      searchContainer.addEventListener('mouseleave', () => {
        searchContainer.classList.remove('border-primary/50');
      });
    }

    const mainEl = document.querySelector('main');

    async function loadRoute(pathname) {
      if (pathname === '/blog' || pathname === '/blog.html') {
        try {
          const res = await fetch('/blog.html');
          if (res.ok) {
            const html = await res.text();
            if (mainEl) {
              mainEl.innerHTML = html;
            }
          }
        } catch (err) {
          console.error('Failed to load route:', err);
        }
      } else if (pathname === '/projects' || pathname === '/projects.html') {
        try {
          const res = await fetch('/projects.html');
          if (res.ok) {
            const html = await res.text();
            if (mainEl) {
              mainEl.innerHTML = html;
            }
          }
        } catch (err) {
          console.error('Failed to load route:', err);
        }
      }
    }

    document.addEventListener('click', (e) => {
      const anchor = e.target.closest('a');
      if (anchor && anchor.getAttribute('href')?.startsWith('/')) {
        const href = anchor.getAttribute('href');
        if (href === '/blog' || href === '/projects') {
          e.preventDefault();
          history.pushState(null, '', href);
          loadRoute(href);
        }
      }
    });

    window.addEventListener('popstate', () => {
      loadRoute(location.pathname);
    });

    loadRoute(location.pathname);
  });
</script>
